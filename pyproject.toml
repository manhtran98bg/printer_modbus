[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printer_modbus"
version = "1.0"
description = "Headless Modbus service for printer integration"
requires-python = ">=3.11"
dependencies = [
    "pymodbus>=3.6,<4",
    "pyserial>=3.5,<4",
]

[project.scripts]
printer_modbus = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.infrastructure.dashboard" = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
